<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cobalt AOI Atlas</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;background:#0d1117;color:#e6edf3}
#app{display:flex;flex-direction:column;height:100vh}

/* TOP BAR */
#topbar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:#161b22;border-bottom:1px solid #30363d;flex-shrink:0;z-index:1000;flex-wrap:wrap}
.brand{font-size:14px;font-weight:600;color:#f0f6fc;white-space:nowrap;flex-shrink:0}
.brand-sub{font-size:10px;color:#484f58;display:block;margin-top:1px;font-weight:400}

/* Search */
#search-wrap{position:relative;flex:1;min-width:180px;max-width:360px}
#search{width:100%;background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:6px 30px 6px 10px;font-size:12px;color:#e6edf3;outline:none;transition:border-color .15s}
#search:focus{border-color:#58a6ff}
#search::placeholder{color:#484f58}
#search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:#484f58;cursor:pointer;font-size:14px;line-height:1;padding:0;display:none}
#search-clear:hover{color:#8b949e}
#search-hint{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#161b22;border:1px solid #30363d;border-radius:8px;z-index:2000;max-height:260px;overflow-y:auto;display:none}
.search-item{display:flex;align-items:center;gap:8px;padding:7px 10px;cursor:pointer;border-bottom:1px solid #21262d;transition:background .1s}
.search-item:last-child{border-bottom:none}
.search-item:hover{background:#21262d}
.si-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.si-right{flex:1;min-width:0}
.si-name{font-size:12px;color:#e6edf3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.si-sub{font-size:10px;color:#6e7681}
.si-count{font-size:10px;color:#484f58;flex-shrink:0}
.no-results{padding:12px;text-align:center;color:#484f58;font-size:12px}

/* Top-right controls */
#top-right{display:flex;gap:6px;align-items:center;margin-left:auto;flex-shrink:0}
.ctrl-btn{font-size:11px;padding:4px 10px;border-radius:6px;border:1px solid #30363d;background:transparent;color:#8b949e;cursor:pointer;transition:all .15s;white-space:nowrap}
.ctrl-btn:hover{border-color:#8b949e;color:#c9d1d9}
.ctrl-btn.active{background:#1f6feb22;border-color:#1f6feb;color:#58a6ff}
.ctrl-btn.on{background:#3fb95022;border-color:#3fb950;color:#3fb950}

/* LEGEND */
#legend-strip{display:flex;align-items:center;gap:4px;padding:5px 14px;background:#0d1117;border-bottom:1px solid #21262d;flex-shrink:0;flex-wrap:wrap;z-index:999}
.leg-btn{display:flex;align-items:center;gap:5px;font-size:11px;padding:3px 9px;border-radius:20px;border:1px solid #21262d;background:#161b22;color:#8b949e;cursor:pointer;transition:all .15s;white-space:nowrap;user-select:none}
.leg-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.leg-btn:hover{border-color:#30363d;color:#c9d1d9}
.leg-btn.hl{border-color:var(--c)!important;color:#e6edf3!important;background:color-mix(in srgb,var(--c) 18%,#161b22)!important}
.leg-count{color:#30363d;font-size:10px;margin-left:2px}

/* BODY */
#body{display:flex;flex:1;overflow:hidden;min-height:0}
#map{flex:1;height:100%;min-width:0}

/* PANEL */
#panel{width:340px;min-width:340px;background:#0d1117;border-left:1px solid #21262d;display:flex;flex-direction:column;overflow:hidden;transition:width .2s,min-width .2s}
#panel.hidden{width:0;min-width:0}
#panel-scroll{flex:1;overflow-y:auto;padding:16px}
#panel-scroll::-webkit-scrollbar{width:3px}
#panel-scroll::-webkit-scrollbar-thumb{background:#21262d;border-radius:2px}

/* Panel nav */
#panel-nav{display:flex;align-items:center;gap:8px;margin-bottom:12px;min-height:24px}
#back-btn{display:none;background:none;border:none;color:#58a6ff;cursor:pointer;font-size:12px;padding:0;align-items:center;gap:4px}
#back-btn:hover{color:#79c0ff}
#back-btn svg{flex-shrink:0}

/* Direction toggle */
#dir-toggle{display:none;gap:0;margin-bottom:12px;border:1px solid #21262d;border-radius:8px;overflow:hidden}
.dir-btn{flex:1;font-size:11px;padding:5px 0;background:transparent;border:none;border-right:1px solid #21262d;color:#6e7681;cursor:pointer;transition:all .15s}
.dir-btn:last-child{border-right:none}
.dir-btn.active{background:#21262d;color:#e6edf3;font-weight:500}

/* Panel content */
.p-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500;margin-bottom:10px}
.p-badge-dot{width:7px;height:7px;border-radius:50%}
.p-name{font-size:15px;font-weight:600;color:#f0f6fc;margin-bottom:14px;line-height:1.4}
.p-close{background:none;border:none;color:#484f58;cursor:pointer;font-size:18px;line-height:1;padding:0;margin-left:auto}
.p-close:hover{color:#e6edf3}
.p-section{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:#484f58;margin:16px 0 7px;padding-bottom:5px;border-bottom:1px solid #21262d}
.meta-row{display:flex;gap:8px;margin-bottom:4px;font-size:12px;line-height:1.5}
.meta-key{color:#6e7681;width:80px;flex-shrink:0;font-size:11px}
.meta-val{color:#c9d1d9;flex:1;word-break:break-word}

/* Connection cards */
.conn-card{border-left:2px solid var(--cc);background:#161b22;border-radius:0 6px 6px 0;padding:8px 10px;margin-bottom:5px;cursor:pointer;transition:background .12s}
.conn-card:hover{background:#1c2128}
.conn-top{display:flex;align-items:flex-start;gap:7px}
.conn-cdot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:3px}
.conn-right{flex:1;min-width:0}
.conn-name{font-size:12px;font-weight:500;color:#e6edf3;line-height:1.4;word-break:break-word}
.conn-sub{font-size:11px;color:#6e7681;margin-top:1px}
.conn-commodity{font-size:11px;color:#8b949e;margin-top:4px;padding-top:4px;border-top:1px solid #21262d}
.conn-metas{display:flex;gap:8px;margin-top:3px;flex-wrap:wrap}
.conn-meta{font-size:10px;color:#6e7681}
.conn-meta b{color:#8b949e;font-weight:400}
.conn-cite{display:flex;align-items:center;gap:8px;margin-top:5px;padding-top:4px;border-top:1px dashed #21262d;flex-wrap:wrap}
.cite-link{font-size:10px;color:#1f6feb;text-decoration:none;display:inline-flex;align-items:center;gap:3px}
.cite-link:hover{color:#58a6ff;text-decoration:underline}
.cite-note{font-size:10px;color:#484f58;font-style:italic}

/* Chain list items */
.chain-item{display:flex;align-items:center;gap:7px;padding:5px 7px;border-radius:6px;margin-bottom:2px;cursor:pointer;transition:background .1s}
.chain-item:hover{background:#161b22}
.chain-cdot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.chain-name{font-size:12px;color:#c9d1d9;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chain-sub{font-size:10px;color:#6e7681;flex-shrink:0;margin-left:4px}

/* Chain count badge */
.chain-badge{display:inline-block;font-size:10px;padding:1px 7px;border-radius:10px;background:#21262d;color:#6e7681;margin-left:6px;vertical-align:middle}

.empty-state{text-align:center;padding:40px 16px;color:#484f58;font-size:12px;line-height:1.7}

/* Leaflet */
.leaflet-control-zoom{border:1px solid #30363d!important;background:#161b22!important;border-radius:8px!important;overflow:hidden}
.leaflet-control-zoom a{background:#161b22!important;color:#8b949e!important;border-color:#30363d!important;width:28px!important;height:28px!important;line-height:28px!important}
.leaflet-control-zoom a:hover{background:#21262d!important;color:#e6edf3!important}
.leaflet-control-attribution{background:rgba(13,17,23,.75)!important;color:#484f58!important;font-size:9px!important}
.leaflet-control-attribution a{color:#6e7681!important}
.leaflet-container{background:#0d1117}
/* Dot wrapper: large hit area, small visual */
.dot-wrap{display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:50%}
.dot-vis{border-radius:50%;border:1.5px solid rgba(255,255,255,.22);transition:transform .12s,opacity .15s,box-shadow .12s}
.dot-vis.selected{transform:scale(2)!important;border-color:rgba(255,255,255,.9)!important;box-shadow:0 0 0 3px rgba(255,255,255,.2)!important}
.dot-vis.chain{transform:scale(1.4)!important;border-color:rgba(255,255,255,.5)!important}
.dot-vis.dim{opacity:.08!important}
</style>
</head>

    </div>
  </div>
</div>

</div><!-- #app -->

/* ═══════════════════════════════════════════════════
   INDEX DATA
═══════════════════════════════════════════════════ */
const nodeMap = {};
DATA.nodes.forEach(n => nodeMap[n.id] = n);

const adj = {};
DATA.nodes.forEach(n => adj[n.id] = []);
DATA.links.forEach(l => {
  if (l.s === l.t) return;
  (adj[l.s] = adj[l.s]||[]).push({link:l, nid:l.t, dir:'out'});
  (adj[l.t] = adj[l.t]||[]).push({link:l, nid:l.s, dir:'in'});
});

const TILES = {
  dark:      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',    {subdomains:'abcd',maxZoom:19,attribution:'© OpenStreetMap · © CartoDB'}),

const map = L.map('map',{zoomControl:true,preferCanvas:false}).setView([15,20],3);
let curLayer='dark'; TILES.dark.addTo(map);

function setLayer(n){
  map.removeLayer(TILES[curLayer]); TILES[n].addTo(map); curLayer=n;
  ['dark','satellite','street'].forEach(k => document.getElementById('btn-'+k).classList.toggle('active',k===n));
}

/* ═══════════════════════════════════════════════════
   MARKERS — 24px hit area, 14px visual dot
═══════════════════════════════════════════════════ */
const HIT=24, VIS=14;
const markerRefs = {}; // id -> {dotEl, marker}

DATA.nodes.forEach(n => {
  const col = c(n.step);
  const wrap = document.createElement('div');
  wrap.className='dot-wrap';
  wrap.style.cssText=`width:${HIT}px;height:${HIT}px`;
  const dot = document.createElement('div');
  dot.className='dot-vis';
  dot.style.cssText=`width:${VIS}px;height:${VIS}px;background:${col};box-shadow:0 0 6px ${col}77`;
  wrap.appendChild(dot);
  const icon   = L.divIcon({className:'',html:wrap,iconSize:[HIT,HIT],iconAnchor:[HIT/2,HIT/2]});
  const marker = L.marker([n.lat,n.lon],{icon}).addTo(map);
  marker.on('click',()=>onNodeClick(n.id));
  markerRefs[n.id]={dotEl:dot,marker};
});

/* ═══════════════════════════════════════════════════
   LINES
═══════════════════════════════════════════════════ */
const chainLineGroup = L.layerGroup().addTo(map);
const allLineGroup   = L.layerGroup().addTo(map);
let chainLines=[], allLinesDrawn=false, showAllLines=false;

function clearChainLines(){ chainLines.forEach(l=>chainLineGroup.removeLayer(l)); chainLines=[]; }

function drawChainLines(links){
  clearChainLines();
  links.forEach(lk=>{
    const s=nodeMap[lk.s],t=nodeMap[lk.t];
    if(!s||!t||s.id===t.id) return;
    const ln=L.polyline([[s.lat,s.lon],[t.lat,t.lon]],{color:c(s.step),weight:2,opacity:.8}).addTo(chainLineGroup);
    chainLines.push(ln);
  });
}

function renderAllLines(){
  allLineGroup.clearLayers(); allLinesDrawn=true;
  DATA.links.forEach(lk=>{
    const s=nodeMap[lk.s],t=nodeMap[lk.t];
    if(!s||!t||s.id===t.id) return;
    L.polyline([[s.lat,s.lon],[t.lat,t.lon]],{color:c(s.step),weight:1,opacity:.25}).addTo(allLineGroup);
  });
}

function toggleAllLines(){
  showAllLines=!showAllLines;
  const btn=document.getElementById('alllines-btn');
  btn.classList.toggle('on',showAllLines);
  btn.textContent=showAllLines?'Hide all connections':'Show all connections';
  if(showAllLines){ if(!allLinesDrawn) renderAllLines(); allLineGroup.addTo(map); }
  else             { map.removeLayer(allLineGroup); }
}

/* ═══════════════════════════════════════════════════
   BFS TRAVERSAL
═══════════════════════════════════════════════════ */
function bfs(startId, dirs){
  const visitedNodes=new Set(), visitedLinks=[];
  const queue=[startId];
  while(queue.length){
    const cur=queue.shift();
    if(visitedNodes.has(cur)) continue;
    visitedNodes.add(cur);
    (adj[cur]||[]).filter(x=>dirs.includes(x.dir)).forEach(({link,nid})=>{
      visitedLinks.push(link);
      if(!visitedNodes.has(nid)) queue.push(nid);
    });
  }
  return {nodes:visitedNodes, links:visitedLinks};
}

function getChain(startId){
  if(chainDir==='downstream') return bfs(startId,['out']);
  if(chainDir==='upstream')   return bfs(startId,['in']);
  // 'both': only direct (one-hop) neighbors in each direction
  const nodes=new Set([startId]), links=[];
  (adj[startId]||[]).forEach(({link,nid})=>{ nodes.add(nid); links.push(link); });
  return {nodes, links};
}

/* ═══════════════════════════════════════════════════
   NODE CLICK
═══════════════════════════════════════════════════ */
function onNodeClick(id, pushNav=true){
  const node=nodeMap[id]; if(!node) return;
  if(pushNav) navStack.push({type:'node',id});
  selectedId=id;

  const {nodes:chain, links:clinks}=getChain(id);
  clearChainLines(); drawChainLines(clinks);

  resetMarkers();
  Object.entries(markerRefs).forEach(([nid,{dotEl}])=>{
    if(nid===id)           dotEl.classList.add('selected');
    else if(chain.has(nid)) dotEl.classList.add('chain');
    else                    dotEl.classList.add('dim');
  });

  renderNodePanel(node, clinks);
  updateBackBtn();
}

/* ═══════════════════════════════════════════════════
   DIRECTION TOGGLE
═══════════════════════════════════════════════════ */
function setDir(dir){
  chainDir=dir;
  document.querySelectorAll('.dir-btn').forEach(b=>b.classList.toggle('active',b.dataset.dir===dir));
  if(selectedId) onNodeClick(selectedId, false);
}

/* ═══════════════════════════════════════════════════
   STEP / LEGEND CLICK
═══════════════════════════════════════════════════ */
function onStepClick(step){
  if(activeSteps.has(step)) activeSteps.delete(step);
  else activeSteps.add(step);
  if(activeSteps.size===0){ resetAll(); return; }

  if(navStack.length>0 && navStack[navStack.length-1].type==='steps'){
    navStack[navStack.length-1].steps=new Set(activeSteps);
  } else {
    navStack.push({type:'steps',steps:new Set(activeSteps)});
  }

  selectedId=null;
  clearChainLines(); resetMarkers();
  document.querySelectorAll('.leg-btn').forEach(b=>b.classList.toggle('hl',activeSteps.has(b.dataset.step)));
  Object.entries(markerRefs).forEach(([nid,{dotEl}])=>{
    activeSteps.has(nodeMap[nid]?.step) ? dotEl.classList.add('chain') : dotEl.classList.add('dim');
  });
  renderStepPanel(activeSteps);
  updateBackBtn();
}

function restoreSteps(stepsSet){
  activeSteps=new Set(stepsSet);
  selectedId=null;
  clearChainLines(); resetMarkers();
  document.querySelectorAll('.leg-btn').forEach(b=>b.classList.toggle('hl',activeSteps.has(b.dataset.step)));
  Object.entries(markerRefs).forEach(([nid,{dotEl}])=>{
    activeSteps.has(nodeMap[nid]?.step) ? dotEl.classList.add('chain') : dotEl.classList.add('dim');
  });
  renderStepPanel(activeSteps);
  updateBackBtn();
}

/* ═══════════════════════════════════════════════════
   BACK NAVIGATION
═══════════════════════════════════════════════════ */
function updateBackBtn(){
  const btn=document.getElementById('back-btn');
  if(!btn) return;
  const prev=navStack.length>1 ? navStack[navStack.length-2] : null;
  if(!prev){ btn.style.display='none'; return; }
  btn.style.display='inline-flex';
  btn.textContent='';
  btn.innerHTML=`<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg> ${prev.type==='steps'?([...prev.steps].length===1?[...prev.steps][0]:'Filters'):'Back'}`;
}

function goBack(){
  navStack.pop();
  const prev=navStack[navStack.length-1];
  if(!prev){ resetAll(); return; }
  if(prev.type==='steps')  restoreSteps(prev.steps);
  if(prev.type==='node')   onNodeClick(prev.id,   false);
  if(prev.type==='search'){
    searchInput.value=prev.q||'';
    searchClear.style.display=prev.q?'block':'none';
    const matches=searchNodes(prev.q||'');
    highlightSearchResults(matches);
    renderSearchPanel(matches, prev.q||'');
  }
}

/* ═══════════════════════════════════════════════════
   PANEL RENDERING HELPERS
═══════════════════════════════════════════════════ */
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function panelTopHtml(){
  return `<div id="panel-nav" style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
    <button id="back-btn" onclick="goBack()" style="display:none;background:none;border:none;color:#58a6ff;cursor:pointer;font-size:11px;padding:0;align-items:center;gap:3px"></button>
    <button class="p-close" onclick="resetAll()" style="margin-left:auto">✕</button>
  </div>`;
}

function citationHtml(link){
  if(!link.src && !link.notes1) return '';
  let h='<div class="conn-cite">';
  if(link.src) h+=`<a class="cite-link" href="${esc(link.src)}" target="_blank" rel="noopener"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>Source</a>`;
  if(link.notes1) h+=`<span class="cite-note">${esc(link.notes1)}</span>`;
  h+='</div>';
  return h;
}

function connCardHtml(link, nbrId){
  const nb=nodeMap[nbrId]; if(!nb) return '';
  const col=c(nb.step);
  const metas=[];
  if(link.r) metas.push(`<span class="conn-meta" style="color:${link.r==='Yes'?'#3fb950':link.r==='No'?'#f85149':'#6e7681'}">${link.r==='Yes'?'Confirmed':link.r==='No'?'Planned':link.r}</span>`);
  if(link.dt) metas.push(`<span class="conn-meta"><b>${esc(link.dt)}</b></span>`);
  if(link.amt) metas.push(`<span class="conn-meta">${esc(link.amt)} t</span>`);
  const metaHtml=metas.length?`<div class="conn-metas">${metas.join('')}</div>`:'';
  const noteHtml=link.notes?`<div class="conn-metas"><span class="conn-meta" style="font-style:italic">${esc(link.notes)}</span></div>`:'';
  const safeId=nbrId.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
  return `<div class="conn-card" style="--cc:${col}" onclick="onNodeClick('${safeId}')">
    <div class="conn-top">
      <div class="conn-cdot" style="background:${col}"></div>
      <div class="conn-right">
        <div class="conn-name">${esc(nb.name||nbrId)}</div>
        <div class="conn-sub">${esc(nb.step)} · ${esc(nb.country)}</div>
        ${link.c?`<div class="conn-commodity">${esc(link.c)}</div>`:''}
        ${metaHtml}${noteHtml}${citationHtml(link)}
      </div>
    </div>
  </div>`;
}

/* ═══════════════════════════════════════════════════
   RENDER NODE PANEL
═══════════════════════════════════════════════════ */
function renderNodePanel(node, chainLinks){
  const col = c(node.step);
  const directOut=(adj[node.id]||[]).filter(x=>x.dir==='out');
  const directIn =(adj[node.id]||[]).filter(x=>x.dir==='in');
  const {nodes:dn}=bfs(node.id,['out']); const downCount=dn.size-1;
  const {nodes:un}=bfs(node.id,['in']);  const upCount=un.size-1;

  const dirToggle=`<div id="dir-toggle" data-dir="${chainDir}" style="display:flex;gap:0;margin-bottom:14px;border:1px solid #21262d;border-radius:8px;overflow:hidden">
    ${['downstream','upstream','both'].map(d=>`<button class="dir-btn${chainDir===d?' active':''}" data-dir="${d}" onclick="setDir('${d}')">${d==='downstream'?'↓ Downstream':d==='upstream'?'↑ Upstream':'↕ Both'}</button>`).join('')}
  </div>`;

  const outHtml=directOut.map(({link,nid})=>connCardHtml(link,nid)).join('');
  const inHtml =directIn.map(({link,nid})=>connCardHtml(link,nid)).join('');

  let sectionLabel='';
  if(chainDir==='downstream') sectionLabel=`Sends material to <span class="chain-badge">${downCount} downstream</span>`;
  else if(chainDir==='upstream') sectionLabel=`Receives material from <span class="chain-badge">${upCount} upstream</span>`;
  else sectionLabel=`Full chain <span class="chain-badge">${downCount+upCount} facilities</span>`;

  document.getElementById('panel-scroll').innerHTML = `
    ${panelTopHtml()}
    <div class="p-badge" style="background:${col}22;border:1px solid ${col}44;color:${col}">
      <div class="p-badge-dot" style="background:${col}"></div>${esc(node.step||'Unknown')}
    </div>
    <div class="p-name">${esc(node.name||node.id)}</div>
    ${dirToggle}
    <div class="p-section">Facility</div>
    <div class="meta-row"><div class="meta-key">Facility type</div><div class="meta-val">${esc(node.facility||'—')}</div></div>
    <div class="meta-row"><div class="meta-key">Location</div><div class="meta-val">${esc(node.place||'—')}</div></div>
    <div class="meta-row"><div class="meta-key">Country</div><div class="meta-val">${esc(node.country||'—')}</div></div>
    ${node.type?`<div class="meta-row"><div class="meta-key">Company type</div><div class="meta-val">${esc(node.type)}</div></div>`:''}
    ${node.parent?`<div class="meta-row"><div class="meta-key">Parent co.</div><div class="meta-val">${esc(node.parent)}</div></div>`:''}
    <div class="meta-row"><div class="meta-key">Coordinates</div><div class="meta-val">${node.lat}, ${node.lon}</div></div>
    ${chainDir!=='upstream'  && directOut.length ? `<div class="p-section">${chainDir==='both'?'Sends to':sectionLabel}</div>${outHtml}` : ''}
    ${chainDir!=='downstream'&& directIn.length  ? `<div class="p-section">${chainDir==='both'?'Receives from':sectionLabel}</div>${inHtml}` : ''}
    ${!directOut.length&&!directIn.length?`<div style="color:#484f58;font-size:12px;margin-top:8px">No recorded connections.</div>`:''}
  `;
  document.getElementById('panel').classList.remove('hidden');
  updateBackBtn();
}

/* ═══════════════════════════════════════════════════
   RENDER STEP PANEL
═══════════════════════════════════════════════════ */
function renderStepPanel(stepsSet){
  const steps=[...stepsSet].sort((a,b)=>STEP_ORDER.indexOf(a)-STEP_ORDER.indexOf(b));
  const nodes=DATA.nodes.filter(n=>stepsSet.has(n.step));
  nodes.sort((a,b)=>STEP_ORDER.indexOf(a.step)-STEP_ORDER.indexOf(b.step));
  const rows=nodes.map(n=>{
    const col=c(n.step);
    const safeId=n.id.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    return `<div class="chain-item" onclick="onNodeClick('${safeId}')">
      <div class="chain-cdot" style="background:${col}"></div>
      <div class="chain-name">${esc(n.name||n.id)}</div>
      <div class="chain-sub">${steps.length>1?esc(n.step)+' · ':''}${esc(n.country)}</div>
    </div>`;
  }).join('');
  const badgeHtml=steps.length===1
    ? `<div class="p-badge" style="background:${c(steps[0])}22;border:1px solid ${c(steps[0])}44;color:${c(steps[0])}"><div class="p-badge-dot" style="background:${c(steps[0])}"></div>${esc(steps[0])}</div>`
    : `<div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px">${steps.map(s=>`<div class="p-badge" style="background:${c(s)}22;border:1px solid ${c(s)}44;color:${c(s)}"><div class="p-badge-dot" style="background:${c(s)}"></div>${esc(s)}</div>`).join('')}</div>`;
  document.getElementById('panel-scroll').innerHTML=`
    ${panelTopHtml()}
    ${badgeHtml}
    <div class="p-name">${nodes.length} facilit${nodes.length!==1?'ies':'y'}</div>
    <div class="p-section">Click a facility to trace its chain</div>
    ${rows}
  `;
  document.getElementById('panel').classList.remove('hidden');
  updateBackBtn();
}

/* ═══════════════════════════════════════════════════
   SEARCH
═══════════════════════════════════════════════════ */
const searchInput = document.getElementById('search');
const searchHint  = document.getElementById('search-hint');
const searchClear = document.getElementById('search-clear');
let searchTimer=null;

function pushSearchState(q){
  if(navStack.length>0 && navStack[navStack.length-1].type==='search'){
    navStack[navStack.length-1]={type:'search',q};
  } else {
    navStack.push({type:'search',q});
  }
}

function searchNodes(q){
  q=q.toLowerCase().trim();
  if(!q) return [];
  return DATA.nodes.filter(n=>[n.name,n.country,n.place,n.step,n.facility,n.parent,n.type]
    .some(v=>(v||'').toLowerCase().includes(q))).slice(0,30);
}

function highlightSearchResults(matches){
  resetMarkers(); clearChainLines();
  document.querySelectorAll('.leg-btn').forEach(b=>b.classList.remove('hl'));
  if(!matches.length){ resetMarkers(); return; }
  const matchIds=new Set(matches.map(n=>n.id));
  Object.entries(markerRefs).forEach(([nid,{dotEl}])=>{
    matchIds.has(nid) ? dotEl.classList.add('chain') : dotEl.classList.add('dim');
  });
}

function renderSearchPanel(matches, q){
  const panel=document.getElementById('panel');
  if(!matches.length){
    panel.classList.remove('hidden');
    document.getElementById('panel-scroll').innerHTML=`
      ${panelTopHtml()}
      <div class="p-name" style="color:#484f58">No results for "${esc(q)}"</div>
      <div style="font-size:12px;color:#484f58;margin-top:8px">Try searching by country, company name, or facility type.</div>`;
    return;
  }
  const rows=matches.map(n=>{
    const col=c(n.step); const safeId=n.id.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    return `<div class="chain-item" onclick="onNodeClick('${safeId}')">
      <div class="chain-cdot" style="background:${col}"></div>
      <div class="chain-name">${esc(n.name||n.id)}</div>
      <div class="chain-sub">${esc(n.step)} · ${esc(n.country)}</div>
    </div>`;
  }).join('');
  panel.classList.remove('hidden');
  document.getElementById('panel-scroll').innerHTML=`
    ${panelTopHtml()}
    <div class="p-name">${matches.length} result${matches.length!==1?'s':''}</div>
    <div class="p-section">Click a result to trace its chain</div>
    ${rows}`;
  updateBackBtn();
}

searchInput.addEventListener('input', ()=>{
  clearTimeout(searchTimer);
  const q=searchInput.value;
  searchClear.style.display=q?'block':'none';
  if(!q){ searchHint.style.display='none'; resetAll(); return; }
  searchTimer=setTimeout(()=>{
    const matches=searchNodes(q);
    // Inline hint dropdown (top 8)
    if(matches.length){
      searchHint.style.display='block';
      searchHint.innerHTML=matches.slice(0,8).map(n=>{
        const col=c(n.step); const safeId=n.id.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
        return `<div class="search-item" onclick="clearSearchAndGo('${safeId}')">
          <div class="si-dot" style="background:${col}"></div>
          <div class="si-right">
            <div class="si-name">${esc(n.name||n.id)}</div>
            <div class="si-sub">${esc(n.step)} · ${esc(n.country)}</div>
          </div>
        </div>`;
      }).join('') + (matches.length>8?`<div class="no-results">${matches.length-8} more — press Enter to see all</div>`:'');
    } else {
      searchHint.style.display='block';
      searchHint.innerHTML=`<div class="no-results">No results for "${esc(q)}"</div>`;
    }
    pushSearchState(q);
    highlightSearchResults(matches);
    renderSearchPanel(matches, q);
  }, 200);
});

searchInput.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ clearSearch(); }
  if(e.key==='Enter'){
    searchHint.style.display='none';
    const q=searchInput.value;
    const matches=searchNodes(q);
    pushSearchState(q);
    highlightSearchResults(matches);
    renderSearchPanel(matches,q);
  }
});

document.addEventListener('click', e=>{
  if(!e.target.closest('#search-wrap')) searchHint.style.display='none';
});

function clearSearch(){
  searchInput.value=''; searchClear.style.display='none';
  searchHint.style.display='none'; resetAll();
}

function clearSearchAndGo(id){
  searchInput.value=''; searchClear.style.display='none';
  searchHint.style.display='none';
  onNodeClick(id);
}

/* ═══════════════════════════════════════════════════
   LEGEND BUILD
═══════════════════════════════════════════════════ */
function buildLegend(){
  const strip=document.getElementById('legend-strip');
  STEP_ORDER.forEach(step=>{
    const col=c(step);
    const count=DATA.nodes.filter(n=>n.step===step).length;
    const btn=document.createElement('button');
    btn.className='leg-btn'; btn.dataset.step=step;
    btn.style.setProperty('--c',col);
    btn.innerHTML=`<div class="leg-dot" style="background:${col}"></div>${step}<span class="leg-count">${count}</span>`;
    btn.onclick=()=>{ onStepClick(step); };
    strip.appendChild(btn);
  });
}

buildLegend();
setTimeout(()=>map.invalidateSize(),150);
</script>
</body>
